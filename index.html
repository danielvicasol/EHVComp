<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparativa PRO Vehiculo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
<h1>🚗 Comparativa PRO Consumo</h1>

<div class="controls">
<label>€/kWh <input id="precioKwh" type="number" step="0.01" value="0.12"></label>
<label>€/L gasolina <input id="precioGasolina" type="number" step="0.01" value="1.37"></label>
<label>km/año <input id="kmAnuales" type="number" value="15000"></label>
<label>Consumo gasolina 
<select id="consumoGasolina">
  <option value="7">7 L/100km</option>
  <option value="7.5">7.5 L/100km</option>
</select>
</label>
<button id="reset">Reset</button>
</div>

<canvas id="chart"></canvas>

<div class="results">
<p>Coste eléctrico: <span id="electrico"></span></p>
<p>Coste gasolina: <span id="gasolina"></span></p>
<p>Ahorro anual: <span id="ahorro"></span></p>
</div>

<button id="export">Exportar imagen</button>
</div>
<script src="script.js"></script>
</body>
</html>
